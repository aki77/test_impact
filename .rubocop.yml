inherit_mode:
  merge:
    - Exclude

inherit_gem:
  sgcop:
    - ruby/rubocop_strict.yml
    - ruby/rubocop_rspec_strict.yml

# The integration test drives heavy out-of-process work -- git init on the sample app plus
# bundle exec rspec -- so it must run exactly once, in before(:context). An instance variable is
# the only way before(:context) can hand a value to the examples: replacing it with a memoized
# let would re-run those external processes for every example whenever collection fails (a single
# before(:context) failure takes down every example beneath it). @map is read-only and is never
# mutated by the examples.
RSpec/InstanceVariable:
  Exclude:
    - 'spec/integration/rspec_collection_spec.rb'

# Map's contract is to normalize the arrays passed to build into Sets (Map#specs_for / #index /
# #merge all depend on Set operations), so `eq(Set[...])` doubles as the assertion that this
# normalization actually happened. Switching to the cop's suggested contain_exactly would only
# compare elements, letting the tests pass even if a return value regressed to an Array. Every
# element of the expected value is already a string literal, so the cop's actual intent -- write
# expectations as literals -- is satisfied.
# Likewise, a_string_starting_with is an RSpec composable matcher rather than a computed
# expectation, and `base_time + 10` is left as-is because "10 seconds newer" is the very subject
# of that test.
Sgcop/Rspec/NoMethodCallInExpectation:
  Exclude:
    - 'spec/integration/rspec_collection_spec.rb'
    - 'spec/test_impact/map_spec.rb'
    - 'spec/test_impact/recorder_spec.rb'

# Keyword arguments are named at the call site, so they do not cause the mistake this cop guards
# against: silently passing positional arguments in the wrong order. Map is a value object whose
# constructors (Map.build / Map#initialize) legitimately take every field of the serialized schema,
# and folding those fields into a parameter object would only trade one kind of complexity for
# another. Positional parameters are still counted, so the default limit keeps applying to them.
Metrics/ParameterLists:
  CountKeywordArgs: false

# The sample app under spec/fixtures is not production code: it is the minimal Ruby project the
# integration test copies, git-inits and runs rspec against. Calculator#add(a, b) is deliberately
# the most trivial function imaginable so that the coverage map it produces is easy to assert on.
# Renaming the parameters to satisfy MinNameLength would add meaning the fixture is meant not to
# have, so the whole fixture tree is excluded rather than this one method.
Naming/MethodParameterName:
  Exclude:
    - 'spec/fixtures/**/*'
