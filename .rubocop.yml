inherit_from: .rubocop_todo.yml

inherit_mode:
  merge:
    - Exclude

inherit_gem:
  sgcop:
    - ruby/rubocop_strict.yml
    - ruby/rubocop_rspec_strict.yml

# 統合テストはサンプルアプリの git init と bundle exec rspec というプロセス外部の重い処理を
# 伴うため before(:context) で1回だけ実行する必要がある。before(:context) が example に値を
# 渡す手段はインスタンス変数しかなく、let によるメモ化に置き換えると収集が失敗したときに
# example ごとに外部プロセスを再実行してしまう（before(:context) は1回の失敗で配下の全
# example を落とす）。@map は読み取り専用で example 側から変更しない。
RSpec/InstanceVariable:
  Exclude:
    - 'spec/integration/rspec_collection_spec.rb'

# Map's contract is to normalize the arrays passed to build into Sets (Map#specs_for / #index /
# #merge all depend on Set operations), so `eq(Set[...])` doubles as the assertion that this
# normalization actually happened. Switching to the cop's suggested contain_exactly would only
# compare elements, letting the tests pass even if a return value regressed to an Array. Every
# element of the expected value is already a string literal, so the cop's actual intent -- write
# expectations as literals -- is satisfied.
# Likewise, a_string_starting_with is an RSpec composable matcher rather than a computed
# expectation, and `base_time + 10` is left as-is because "10 seconds newer" is the very subject
# of that test.
Sgcop/Rspec/NoMethodCallInExpectation:
  Exclude:
    - 'spec/integration/rspec_collection_spec.rb'
    - 'spec/test_impact/map_spec.rb'
    - 'spec/test_impact/recorder_spec.rb'
